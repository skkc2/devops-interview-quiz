name: Deploy OpsLab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: node --check questions.js
      - run: node scripts/validate-question-bank.js
      - run: node scripts/validate-learning-content.js
      - run: node scripts/validate-subjects.js
      - run: python3 scripts/build-subject-packs.py --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser regression tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -v

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the published site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css app.js questions.js README.md ARCHITECTURE.md ROADMAP.md _site/
          cp data/*.json _site/data/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

