name: Credential scan
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  scan:
    name: Full-history credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install pinned scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan all fetched branch and tag history with redacted findings
        run: gitleaks git --redact --no-banner --log-opts="--all" .
