name: Validate and publish beta
on:
  pull_request:
    paths: [RELEASE.md, '.github/workflows/release-beta.yml', tests/test_app.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    uses: ./.github/workflows/security.yml
  validate:
    needs: secret-scan
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          node --check app.js
          node scripts/validate-question-bank.js
          node scripts/validate-learning-content.js
          node scripts/validate-subjects.js
          python3 scripts/build-subject-packs.py --check
      - name: Install browser
        timeout-minutes: 15
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser interaction suite
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v
        env:
          TEST_BROWSER: ${{ matrix.browser }}
  release:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'skkc2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish tested beta commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-beta.1 >/dev/null 2>&1; then
            echo "Beta already exists; leaving it unchanged."
          else
            gh release create v0.1.0-beta.1 --target "$GITHUB_SHA" --prerelease --title 'OpsLab v0.1.0-beta.1' --notes-file RELEASE.md
          fi
