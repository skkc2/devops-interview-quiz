name: Validate quiz
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/security.yml
  validate:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: node --check app.js
      - run: node --check questions.js
      - run: node scripts/validate-question-bank.js
      - run: node scripts/validate-learning-content.js
      - run: node scripts/validate-subjects.js
      - run: python3 scripts/build-subject-packs.py --check
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: python -m unittest discover -s tests -v

